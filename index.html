<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8e3c70">
<title>Un detalle para ti</title><style>:root{color-scheme:light;--rose:#d96ca2;--rose-deep:#87385f;--pink:#ffe5f0;--white:#fffafd;--yellow:#ffdd68}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{min-height:100svh;background:#a85583;color:var(--white);font-family:"Trebuchet MS",Arial,sans-serif;isolation:isolate}button,input,textarea{font:inherit}#backdrop{position:fixed;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.58;filter:saturate(.76) contrast(.96) brightness(.68) blur(3px);transform:scale(1.025);pointer-events:none}.atmosphere{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#35203d18 0%,#47203b0c 48%,#24132c40 100%),radial-gradient(ellipse at 50% 48%,#ffcadf12,transparent 62%)}#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.experience{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 22px 76px;text-align:center}.opening,.reasons{width:min(760px,100%);animation:appear 1.4s cubic-bezier(.18,.75,.28,1) both}.opening h1{margin:0 0 22px;color:#fffafd;font:700 clamp(48px,8vw,86px)/1 "Ever After","Trebuchet MS",Arial,sans-serif;letter-spacing:-.045em;text-shadow:0 3px 0 #a44373,0 5px 11px #6d284d,0 0 34px #ffe0ed}.flower-start{position:relative;display:grid;place-items:center;width:220px;height:220px;margin:auto;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 7px 12px #76304b88)}.flower-start:hover{transform:scale(1.1) rotate(-4deg)}.flower-start:active{transform:scale(.96)}.flower-start:focus-visible,.flower-next:focus-visible,.edit-trigger:focus-visible{outline:3px solid var(--yellow);outline-offset:5px}.daisy-art{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 15px #fff2b777);transition:filter .3s,transform .3s;animation:flowerFloat 4.2s ease-in-out infinite}.flower-start:hover .daisy-art,.flower-next:hover .daisy-art{filter:drop-shadow(0 0 23px #fff2b7);transform:rotate(9deg)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.reasons[hidden]{display:none}.reasons{position:relative;isolation:isolate;padding:35px 22px;animation:reasonIn 1.3s cubic-bezier(.16,.8,.24,1) both}.reasons:before{content:"";position:absolute;z-index:-1;inset:-10% -15%;pointer-events:none;background:radial-gradient(ellipse at center,#642344f5 0%,#742b50eb 42%,#783957a8 72%,transparent 100%);filter:blur(14px)}.reasons>*:not(.bloom){position:relative;z-index:1}.reason-count{margin:0 0 18px;color:#fff0b8;font:700 13px "Trebuchet MS",Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase;text-shadow:0 2px 4px #5b2446,0 0 13px #6b284e}.reason-title{margin:0 auto 17px;max-width:680px;color:#fffafd;font:700 clamp(29px,4.4vw,48px)/1.15 "Ever After","Trebuchet MS",Arial,sans-serif;-webkit-text-stroke:.3px #fff;text-shadow:0 2px 0 #8e3764,0 4px 9px #51203d,0 0 23px #6f3056}.reason-copy{margin:0 auto;max-width:620px;color:#fffafd;font-family:"Trebuchet MS",Arial,sans-serif;font-size:clamp(19px,2.5vw,24px);font-weight:700;line-height:1.6;-webkit-text-stroke:.25px #fff;text-shadow:0 2px 0 #5b1d3e,0 4px 9px #351329,0 0 20px #351329}.reason-copy.prompt{font-size:17px;font-weight:600;color:#fff2c3;font-style:italic}.progress{height:3px;max-width:180px;margin:30px auto 16px;border-radius:9px;background:#fff9;overflow:hidden;box-shadow:0 1px 5px #63264b}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#fffafd,#ffdc61);transition:width .8s ease}.flower-next{display:grid;place-items:center;width:76px;height:76px;margin:0 auto;padding:5px;border:0;border-radius:50%;background:transparent;cursor:pointer;filter:drop-shadow(0 4px 8px #67264b88);transition:transform .25s}.flower-next:hover{transform:scale(1.11) rotate(5deg)}.edit-trigger{position:fixed;z-index:2;right:22px;bottom:20px;padding:9px 13px;border:1px solid #fff9;border-radius:99px;background:#9e4b79d9;color:#fffafd;font-size:12px;backdrop-filter:blur(10px);cursor:pointer;box-shadow:0 4px 15px #67264b66;transition:background .2s,transform .2s}.edit-trigger:hover{background:#b75a89;transform:translateY(-2px)}.mini-daisy{color:#fff2b8;font-size:17px;text-shadow:0 0 7px #fff2b8}.bloom{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.bloom i{position:absolute;font-style:normal;color:#fff9e5;text-shadow:0 0 12px #ffe183;animation:bloomUp 1.55s ease-out forwards}.editor{display:none;position:fixed;inset:0;z-index:10;padding:18px;overflow:auto;background:#63294bbd;backdrop-filter:blur(10px)}.editor.show{display:block}.panel{max-width:760px;margin:20px auto;padding:24px;border:1px solid #f3c9dc;border-radius:24px;background:#fffafd;box-shadow:0 20px 70px #62284d77;color:#71405f}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel h2{margin:0;color:#bd5f91;font:700 27px "Comic Sans MS","Trebuchet MS",sans-serif}.text-close{border:0;background:transparent;color:#a94f7c;font-size:28px;cursor:pointer}.hint{color:#77516a;font:14px/1.55 Arial,sans-serif}.fields{display:grid;gap:11px;margin:18px 0}.field{padding:12px 14px;border:1px solid #efcedd;border-radius:14px;background:#fff}.field label{display:block;margin-bottom:6px;color:#b14f83;font:11px Arial,sans-serif;letter-spacing:.05em}.field textarea{width:100%;min-height:64px;resize:vertical;border:0;outline:none;background:transparent;color:#62334f;font:15px/1.5 "Trebuchet MS",sans-serif}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.saved{margin-right:auto;color:#9b5276;font:12px Arial,sans-serif}.plain-button{padding:10px 15px;border:1px solid #e7bcd1;border-radius:99px;background:white;color:#a6507d;cursor:pointer}.save-button{border-color:#cc6999;background:#cc6999;color:#fff}.toast{position:fixed;bottom:20px;left:50%;z-index:20;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:#8e3c70;color:white;font:13px Arial,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}@keyframes flowerFloat{50%{transform:translateY(-6px) rotate(3deg);filter:drop-shadow(0 0 26px #fff2b7)}}@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes reasonIn{0%{opacity:0;transform:translateY(26px) scale(.97);filter:blur(8px)}65%{opacity:1;filter:blur(0)}100%{transform:none}}@keyframes bloomUp{0%{opacity:0;transform:translateY(16px) scale(.4) rotate(-20deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-100px) scale(1.15) rotate(25deg)}}@media(max-width:600px){.experience{padding:20px 17px 78px}.opening h1{font-size:clamp(47px,12vw,70px)}.reason-title{font-size:clamp(26px,8vw,38px)}.reason-copy{font-size:17px}.edit-trigger{right:12px;bottom:12px;font-size:11px}.panel{padding:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

.opening,.reasons,.puzzle,.finale{width:min(760px,100%);animation:appear 1.2s cubic-bezier(.18,.75,.28,1) both}
.opening h1{display:table;margin:0 auto 25px;padding:17px 32px 20px;border:1px solid #ffeaf5b8;border-radius:30px;background:linear-gradient(135deg,#29162fea,#68324fe8);box-shadow:0 12px 48px #180d2e88,inset 0 1px #fff6;color:#fff;font:800 clamp(42px,8vw,78px)/1.05 "Trebuchet MS",Arial,sans-serif;letter-spacing:-.03em;text-shadow:0 2px 0 #53213f,0 5px 16px #100918,0 0 28px #ffd8edb8;-webkit-text-stroke:.6px #fff2f8}
.experience:has(.opening[hidden]){align-items:center}
.flower-start:focus-visible,.flower-next:focus-visible,.restart:focus-visible,.puzzle-piece:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.puzzle{position:relative;z-index:1;padding:16px}
.puzzle-card{width:min(100%,490px);margin:auto;padding:24px 24px 28px;border:1px solid #ffe6f2c9;border-radius:30px;background:linear-gradient(145deg,#29162feb,#5a2b50eb);box-shadow:0 22px 70px #150b29a6,inset 0 1px #fff7;backdrop-filter:blur(10px)}
.puzzle-card h2{margin:0 0 9px;color:#fff;font:800 clamp(30px,6vw,43px)/1.1 "Trebuchet MS",Arial,sans-serif;text-shadow:0 3px 9px #160a25,0 0 20px #ffd9ec88}
.puzzle-card p{margin:0 auto 20px;color:#fff3f8;font:600 16px/1.5 "Trebuchet MS",Arial,sans-serif;text-shadow:0 2px 5px #160a25}
.puzzle-board{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:min(100%,330px);aspect-ratio:1;margin:auto;padding:6px;border:1px solid #ffe6efaa;border-radius:20px;background:#f8c1d5;box-shadow:0 12px 32px #15091e88}
.puzzle-piece{min-width:0;border:1px solid #fff8;border-radius:9px;background-color:#edabc7;background-repeat:no-repeat;cursor:pointer;box-shadow:inset 0 1px #fff6;transition:filter .18s,transform .18s}
.puzzle-piece:hover:not(.empty){filter:brightness(1.12);transform:scale(.975)}
.puzzle-piece.empty{border:1px dashed #ffe6f2;background:linear-gradient(145deg,#7b3c67,#512650);opacity:.8;cursor:default}
.reasons{position:relative;isolation:isolate;padding:35px 22px;animation:reasonIn 1.1s cubic-bezier(.16,.8,.24,1) both}
.reasons:before{content:"";position:absolute;z-index:-1;inset:-10% -15%;pointer-events:none;background:radial-gradient(ellipse at center,#642344f5 0%,#742b50eb 42%,#783957a8 72%,transparent 100%);filter:blur(14px)}
.reason-copy{margin:0 auto;max-width:620px;color:#fffafd;font:700 clamp(20px,3vw,27px)/1.55 "Trebuchet MS",Arial,sans-serif;-webkit-text-stroke:.25px #fff;text-shadow:0 2px 0 #5b1d3e,0 4px 9px #351329,0 0 20px #351329}
.flower-next{margin-top:28px}
.finale{position:relative;z-index:1;display:grid;place-items:center;min-height:70vh;padding:24px}
.final-card{display:grid;justify-items:center;gap:12px}
.our-heart{width:min(55vw,280px);height:auto;overflow:visible;filter:drop-shadow(0 0 24px #ff7e9c77);animation:heartBeat 1.25s ease-in-out infinite}
.final-copy{margin:0;color:#fff;font:800 clamp(21px,5vw,30px) "Trebuchet MS",Arial,sans-serif;text-shadow:0 2px 8px #41132d}
.restart{padding:11px 20px;border:1px solid #fff9;border-radius:99px;background:#81385ff0;color:white;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #2a0e2b77;transition:transform .2s,background .2s}
.restart:hover{transform:translateY(-2px);background:#a34b79}
@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.07)}28%{transform:scale(1)}42%{transform:scale(1.04)}56%{transform:scale(1)}}
@media(max-width:600px){.opening h1{font-size:clamp(40px,11vw,63px);padding:16px 21px 18px}.puzzle-card{padding:19px 15px 22px}.puzzle-board{gap:4px;padding:5px}.puzzle-piece{border-radius:7px}.reason-copy{font-size:20px}}

.puzzle[hidden],.finale[hidden],.reasons[hidden],.opening[hidden]{display:none!important}


</style>

let w=0,h=0,dpr=1,last=0,lamps=[],ripples=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a),CELL_W=100,CELL_H=130,COLS=4,ROWS=2;
function mapping(){const scale=Math.max(w/1600,h/1000);return{scale,x:(w-1600*scale)/2,y:(h-1000*scale)/2}}
function waterTop(){const m=mapping();return m.y+790*m.scale}
function makeLamp(initial=false){return{x:rand(.03,.97),y:initial?rand(.02,.98):rand(1.02,1.18),size:rand(24,64),speed:rand(.000028,.000072),phase:rand(0,Math.PI*2),sway:rand(7,28),alpha:rand(.67,1),sprite:Math.floor(Math.random()*COLS*ROWS),stretch:rand(.88,1.12)}}
